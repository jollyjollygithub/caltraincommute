name: Refresh schedule

# Regenerates CaltrainUpcoming/schedule.json from Caltrain's GTFS feed and commits
# it when the timetable actually changed. The in-app "reload" then serves it.
on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (~6–7am Pacific)
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write   # push the updated schedule.json
  issues: write     # file a failure issue

# Never run two refreshes at once.
concurrency:
  group: refresh-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate schedule.json
        run: python3 build_schedule.py

      - name: Commit if the schedule changed
        run: |
          if git diff --quiet -- CaltrainUpcoming/schedule.json; then
            echo "Schedule unchanged — nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CaltrainUpcoming/schedule.json
            # --no-verify: the local version-bump pre-commit hook must not run in CI.
            git commit --no-verify -m "Auto-update schedule.json ($(date -u +%F))"
            git push
            echo "Committed a schedule update."
          fi

      - name: Keep-alive (avoid GitHub's 60-day auto-disable)
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          if [ "$days" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/schedule-cron-heartbeat
            git add .github/schedule-cron-heartbeat
            git commit --no-verify -m "Keep scheduled workflow alive"
            git push
            echo "Wrote keep-alive heartbeat (repo was quiet ${days}d)."
          else
            echo "Recent activity (${days}d) — no keep-alive needed."
          fi

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse a single labelled issue instead of piling up new ones.
          gh label create schedule-cron --color B60205 \
            --description "Scheduled schedule.json refresh" 2>/dev/null || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --label schedule-cron --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again — logs: $run_url"
          else
            gh issue create --title "⚠️ Schedule refresh cron failed" --label schedule-cron \
              --body "The scheduled schedule.json refresh failed. Logs: $run_url"
          fi
